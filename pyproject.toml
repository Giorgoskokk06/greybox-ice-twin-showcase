[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greybox-ice-twin-showcase"
version = "0.1.0"
description = "Public mathematical showcase of a physics-informed grey-box digital twin: ISO 19848:2018 automotive-to-maritime isomorphism, orthogonal fault-subspace projection, and full-rank 8-fault observability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Giorgos Kokkaliaris" },
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["greybox_showcase*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
